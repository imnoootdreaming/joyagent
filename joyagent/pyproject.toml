[project]
name = "joyagent"
version = "0.1.0"
description = "An autonomous coding agent — Anthropic-native Agent Runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=1.5.9",
    "docker>=7.1.0",
    "fastapi>=0.138.0",
    "gitpython>=3.1.50",
    "langgraph>=1.2.6",
    "langgraph-checkpoint>=4.1.1",
    "pathspec>=1.1.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.0",
    "tiktoken>=0.13.0",
    "uvicorn>=0.49.0",
]

# RAG 可选依赖 —— 不安装也能正常使用（文本/Markdown/代码入库不受影响），
# 仅 PDF / DOCX 解析需要。安装：pip install -e ".[rag]"
[project.optional-dependencies]
rag = [
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
]
